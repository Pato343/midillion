<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Midillion: name the answer right in the middle. A fan-made game inspired by Krillion and Noillirk.">
<meta name="theme-color" content="#0E1330">
<title>Midillion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one centred column of chunky pixel panels; a slim sky/ground/sea elevation meter in hard colour bands sits beside the play panel. Single dark 8-bit night look. */
:root{
  --night:#0E1330;
  --night-2:#181F4A;
  --night-3:#2A3370;
  --edge:#05081C;
  --paper:#F3EEDF;
  --muted:#A9AFD6;
  --sky-1:#25307A;--sky-2:#3E5CB8;--sky-3:#6FA3E6;--sky:#9FD4F2;
  --grass:#5FC46B;--soil:#8C6A45;--soil-2:#6B4E30;
  --sea:#2F7FB5;--sea-2:#1B5A8F;--deep:#103A66;--abyss:#071C36;
  --mint:#A8E6C3;--mint-d:#4FA97A;
  --lavender:#C9B8F2;--peach:#FFC6A8;--gold:#FFD66E;--gold-d:#C79A2E;
  --raspberry:#E2457A;
  --danger:#FF6B6B;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"VT323","Courier New",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--night);
  background-image:
    linear-gradient(var(--paper),var(--paper)),linear-gradient(var(--paper),var(--paper)),
    linear-gradient(var(--paper),var(--paper)),linear-gradient(var(--paper),var(--paper)),
    linear-gradient(var(--gold),var(--gold));
  background-size:3px 3px,3px 3px,3px 3px,3px 3px,3px 3px;
  background-position:12% 6%,82% 4%,64% 22%,28% 34%,92% 30%;
  background-repeat:no-repeat;background-attachment:fixed;
  color:var(--paper);
  font-family:var(--body);font-size:22px;line-height:1.2;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 40px;
  -webkit-font-smoothing:none;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);z-index:50}
svg.px{shape-rendering:crispEdges;image-rendering:pixelated;display:block}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:var(--pixel);font-weight:400;font-size:1.35rem;margin:0;line-height:1;
  text-shadow:3px 3px 0 var(--raspberry)}
.brand h1 span{color:var(--mint)}
.kin{font-size:1.05rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.kin b{font-weight:400;color:var(--paper)}

/* pixel panel: hard 4px border + stepped drop shadow */
.panel{
  background:var(--night-2);
  box-shadow:0 0 0 4px var(--edge),inset 0 0 0 4px var(--night-3),8px 8px 0 4px var(--edge);
  margin:4px;
}
button{font:inherit;cursor:pointer}
.btn{
  font-family:var(--pixel);font-size:.68rem;line-height:1.4;text-transform:uppercase;
  border:0;padding:14px 18px;margin:4px 10px 10px 4px;
  background:var(--mint);color:var(--night);
  box-shadow:0 0 0 4px var(--edge),inset -4px -4px 0 var(--mint-d),6px 6px 0 4px var(--edge);
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 4px var(--edge),inset 4px 4px 0 var(--mint-d),2px 2px 0 4px var(--edge)}
.btn.alt{background:var(--night-3);color:var(--paper);box-shadow:0 0 0 4px var(--edge),inset -4px -4px 0 #1B2152,6px 6px 0 4px var(--edge)}
.btn.alt:active{box-shadow:0 0 0 4px var(--edge),inset 4px 4px 0 #1B2152,2px 2px 0 4px var(--edge)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:10px 4px;text-decoration:underline;text-underline-offset:4px}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:6px}

/* hero cross-section, hard bands */
.section{display:grid;grid-template-rows:1fr 40px 1fr;height:240px;position:relative;overflow:hidden}
.skyband{position:relative;background:linear-gradient(180deg,var(--sky-1) 0 25%,var(--sky-2) 25% 55%,var(--sky-3) 55% 80%,var(--sky) 80%)}
.groundband{position:relative;background:linear-gradient(180deg,var(--grass) 0 8px,var(--soil) 8px 26px,var(--soil-2) 26px)}
.seaband{position:relative;background:linear-gradient(180deg,var(--sea) 0 25%,var(--sea-2) 25% 50%,var(--deep) 50% 78%,var(--abyss) 78%)}
.lab{position:absolute;font-family:var(--pixel);font-size:.55rem;line-height:1.4;padding:6px 8px;background:var(--edge);color:var(--paper)}
.lab.t{top:10px;left:10px}.lab.b{bottom:10px;left:10px}
.lab.m{left:50%;top:50%;transform:translate(-50%,-50%);color:var(--mint);white-space:nowrap}
.deco{position:absolute}
.krill-hero{position:absolute;left:50%;top:-40px;transform:translateX(-50%);animation:hop 1.2s steps(2) infinite}
@keyframes hop{50%{transform:translate(-50%,-6px)}}

.card{padding:24px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--pixel);font-weight:400;font-size:.95rem;line-height:1.5;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);max-width:60ch}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rule{padding:12px;color:var(--night);display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 0 0 3px var(--edge),inset -3px -3px 0 rgba(0,0,0,.18)}
.rule b{font-family:var(--pixel);font-weight:400;font-size:.55rem;line-height:1.5}
.rule small{font-size:1.05rem;line-height:1.1}
.rule.sky{background:var(--sky)}.rule.mid{background:var(--mint)}.rule.sea{background:var(--lavender)}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.today{color:var(--muted)}
.today b{color:var(--gold);font-weight:400}

/* play */
.play{display:grid;grid-template-columns:64px minmax(0,1fr);gap:18px;align-items:stretch}
.meter{position:relative;min-height:360px;margin:4px;box-shadow:0 0 0 4px var(--edge),6px 6px 0 4px var(--edge);
  background:linear-gradient(180deg,var(--sky-1) 0 10%,var(--sky-2) 10% 22.5%,var(--sky-3) 22.5% 34%,var(--sky) 34% 40%,
    var(--grass) 40% 42%,var(--soil) 42% 52%,var(--soil-2) 52% 60%,
    var(--sea) 60% 66%,var(--sea-2) 66% 77.5%,var(--deep) 77.5% 90%,var(--abyss) 90%)}
.meter .zone{position:absolute;left:0;right:0;top:42.5%;height:15%;
  background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px) top/100% 3px no-repeat,
             repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px) bottom/100% 3px no-repeat}
.meter .tag{position:absolute;left:0;right:0;text-align:center;font-family:var(--pixel);font-size:.42rem;color:var(--paper);text-shadow:2px 2px 0 var(--edge)}
.meter .tick{position:absolute;right:4px;width:8px;height:2px;background:rgba(243,238,223,.6)}
.meter .me{position:absolute;left:50%;transform:translate(-50%,-50%);top:50%;transition:top 1.1s steps(12)}
.meter .me.idle{animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translate(-50%,-70%)}}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;background:var(--night-3);box-shadow:0 0 0 2px var(--edge)}
.dot.now{background:var(--paper);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--night-3)}}
.dot.c{background:var(--gold);box-shadow:0 0 0 2px var(--edge),0 0 0 4px var(--gold)}.dot.g{background:var(--mint)}.dot.y{background:var(--gold)}.dot.s{background:var(--sky)}.dot.l{background:var(--lavender)}.dot.x{background:#4B527F}
.score{color:var(--gold)}
.prompt{font-family:var(--pixel);font-weight:400;font-size:1.05rem;line-height:1.55;margin:0;text-wrap:balance}
.timer{height:16px;background:var(--edge);padding:3px;box-shadow:0 0 0 2px var(--night-3)}
.timer i{display:block;height:100%;width:100%;
  background:repeating-linear-gradient(90deg,var(--mint) 0 10px,transparent 10px 12px)}
.timer i.low{background:repeating-linear-gradient(90deg,var(--danger) 0 10px,transparent 10px 12px)}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{
  flex:1 1 200px;min-width:0;font:inherit;font-size:1.5rem;color:var(--paper);
  background:var(--edge);border:0;padding:8px 14px;margin:4px;
  box-shadow:0 0 0 4px var(--night-3);caret-color:var(--gold);
}
input::placeholder{color:#6F76A6}
.hint{color:var(--muted)}
.hint b{color:var(--paper);font-weight:400}

.reveal{display:flex;flex-direction:column;gap:16px;animation:flash .4s steps(3)}
@keyframes flash{0%{opacity:0}34%{opacity:1}67%{opacity:.4}}
.verdict{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.verdict h3{font-family:var(--pixel);font-weight:400;font-size:1rem;line-height:1.4;margin:0}
.pts{font-family:var(--pixel);font-size:.9rem;color:var(--gold)}
.elev{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.tile{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px;color:var(--night);
  clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px));
  box-shadow:inset -6px -6px 0 rgba(0,0,0,.18),inset 6px 6px 0 rgba(255,255,255,.25)}
.tile small{font-family:var(--pixel);font-size:.42rem;line-height:1.4;opacity:.8}
.tile b{font-weight:400;font-size:clamp(1rem,3.8vw,1.4rem);line-height:1;overflow-wrap:break-word;max-width:100%}
.tile.sky{background:var(--sky);transform:scale(.86)}
.tile.mid{background:var(--mint)}
.tile.sea{background:var(--lavender);transform:scale(.86)}
.yours{background:var(--peach);color:var(--night);padding:10px 14px;display:flex;gap:12px;align-items:center;margin:3px;box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 rgba(0,0,0,.15)}
.yours svg{flex:none}
.yours div{min-width:0}
.yours b{font-family:var(--pixel);font-weight:400;font-size:.6rem;line-height:1.6}
.yours .elev{color:#5A4A6B}
.note{color:#8D93C2;font-size:1.1rem}

.final{text-align:center;align-items:center}
.final .big{font-family:var(--pixel);font-size:2rem;color:var(--gold);line-height:1;text-shadow:4px 4px 0 var(--edge)}
.final .title{font-family:var(--pixel);font-size:1rem;line-height:1.5;color:var(--mint)}
.recap{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.ritem{background:var(--edge);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.rans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{color:var(--night);padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-size:1.1rem;line-height:1;overflow-wrap:break-word;hyphens:auto;min-width:0;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.chip small{font-family:var(--pixel);font-size:.38rem;line-height:1.4;opacity:.8}
.chip.sky{background:var(--sky)}.chip.mid{background:var(--mint)}.chip.sea{background:var(--lavender)}
.recap span{overflow-wrap:anywhere}
.recap em{font-style:normal;color:var(--muted)}
.recap code{font-family:var(--body);color:var(--gold);font-size:1.2rem}
textarea{width:100%;font-family:var(--body);font-size:1.2rem;background:var(--edge);color:var(--paper);border:0;padding:10px;box-shadow:0 0 0 3px var(--night-3)}
.legend{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:2px dashed var(--night-3)}
.lrow:last-child{border-bottom:0}
.lrow .ic{display:flex;justify-content:center}
.lrow b{font-family:var(--pixel);font-weight:400;font-size:.55rem;line-height:1.6;display:block}
.lrow small{color:var(--muted);font-size:1.05rem;line-height:1.1;display:block}
.lrow code{font-family:var(--body);color:var(--gold);font-size:1.25rem;text-align:right;white-space:nowrap}
.lrow.best{background:rgba(168,230,195,.1);box-shadow:inset 4px 0 0 var(--mint)}
.land{position:relative;height:250px;width:calc(100% - 8px);margin:4px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));box-shadow:0 0 0 4px var(--edge);
  background:linear-gradient(180deg,var(--sky-1) 0 10%,var(--sky-2) 10% 22.5%,var(--sky-3) 22.5% 34%,var(--sky) 34% 40%,var(--grass) 40% 42%,var(--soil) 42% 52%,var(--soil-2) 52% 60%,var(--sea) 60% 66%,var(--sea-2) 66% 77.5%,var(--deep) 77.5% 90%,var(--abyss) 90%)}
.land .col{position:relative}
.land .line{position:absolute;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(180deg,var(--paper) 0 4px,transparent 4px 6px)}
.land .cr{position:absolute;left:50%;transform:translate(-50%,-50%)}
.land .num{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--pixel);font-size:.45rem;color:var(--paper)}
.recap .ric{display:flex;align-items:center;justify-content:center;width:32px}
.rrow{display:flex;gap:10px;align-items:center}
.rrow>span:nth-child(2){flex:1 1 auto;min-width:0}
.rrow>em,.rrow>code{flex:none}
@media (max-width:440px){.rrow>em{display:none}}
.miss{color:var(--peach)}
.miss.shake{animation:shake .3s steps(3)}
@keyframes shake{33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}
footer{font-size:1rem;color:#7D84B5;text-align:center;max-width:58ch;margin:0 auto}
@media (max-width:440px){
  body{font-size:20px}
  .rules{grid-template-columns:1fr}
  .prompt{font-size:.82rem}
  .card{padding:18px}
  .brand h1{font-size:1.05rem}
  .play{grid-template-columns:46px minmax(0,1fr);gap:14px}
  .meter .tag{font-size:.34rem}
  .lab{font-size:.45rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<div class="wrap">

  <main id="app"></main>

  <footer>A fan-made game inspired by Krillion and Noillirk. Not affiliated with either. Answer rankings are our own estimates of how often people give each answer.</footer>

<script>
/* ---------- pixel art ---------- */
const ART={
 krill:["....................a.","...................a..","..................a..a",".........######..a..a.",".......##llllll##a.a..","......#lllll###wee#...",".....#ll##d###d#ee#==.","....#l##d###d#######==","...#l##d###d#######...","...#d##d###d######....","...#d##.p.p.p.p.p.....","...##d#.p.p.p.p.p.....","....##d#..............","...tt###..............","..tttt.##.............",".tt..tt..............."],

 butterfly:["..a.....a..","...a...a...",".##..#..##.","#ll#.#.#ll#","#lll###lll#","#llll#llll#",".#lll#lll#.","..##.#.##..",".#ll#.#ll#.",".#l#...#l#.","..#.....#.."],

 crab:["##.#......#.##","###........###",".#...w..w...#.",".##..b..b..##.","..##########..",".############.","..#.#....#.#..",".#..#....#..#."],
 jelly:["...#####...",".##lllll##.","#lllllllll#","#ll#lll#ll#","###########",".l.l.l.l.l.","l..l..l..l.",".l..l..l..l","l..l..l..l.",".l.....l..."],
 ladybug:["..a.....a..","...a...a...","...#####...","..rrr#rrr..",".rrbr#rbrr.","rrrrr#rrrrr","rbrrr#rrrbr",".rrrr#rrrr.","..rrr#rrr.."],

function pixSvg(rows,pal,width,extra=""){
  const h=rows.length,w=rows[0].length;let r="";
  rows.forEach((row,y)=>{[...row].forEach((ch,x)=>{const c=pal[ch];if(c) r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>`;});});
  return `<svg class="px" viewBox="0 0 ${w} ${h}" width="${width}" height="${Math.round(width*h/w)}" aria-hidden="true" ${extra}>${r}</svg>`;
}

/* ---------- data: answers ordered from most common to rarest ---------- */
const RAW = [
 {q:"Name a fruit", a:"Apple;Banana;Orange;Strawberry;Grape;Mango;Pineapple;Watermelon;Pear;Peach;Cherry;Blueberry;Kiwi;Lemon;Raspberry;Plum;Papaya;Coconut;Apricot;Pomegranate;Lime;Fig;Grapefruit;Nectarine;Blackberry;Passion fruit|maracuya;Guava;Lychee|litchi;Persimmon;Dragon fruit|pitaya|pitahaya;Cantaloupe;Tangerine|mandarin;Date;Quince;Kumquat;Lúcuma|lucuma;Cherimoya|chirimoya;Rambutan;Durian;Mangosteen;Soursop|guanabana;Jackfruit;Starfruit|carambola;Gooseberry;Elderberry;Loquat;Pawpaw;Salak|snake fruit;Jabuticaba;Feijoa"},
 {q:"Name an animal that lives in the ocean", a:"Shark;Whale;Dolphin;Octopus;Jellyfish;Starfish|sea star;Seal;Sea turtle|turtle;Crab;Squid;Lobster;Clownfish;Stingray;Shrimp|prawn;Seahorse;Orca|killer whale;Eel;Sea lion;Walrus;Manatee;Tuna;Swordfish;Narwhal;Sea urchin;Oyster;Clam;Krill;Coral;Barracuda;Pufferfish|blowfish;Anglerfish;Manta ray;Cuttlefish;Beluga;Sea otter;Marlin;Sardine;Anchovy;Dugong;Barnacle;Lionfish;Sea anemone|anemone;Sea cucumber;Nudibranch;Sunfish|mola;Hagfish;Coelacanth;Vampire squid;Sea pig;Siphonophore"},
 {q:"Name a country in South America", a:"Brazil|brasil;Argentina;Peru|perú;Chile;Colombia;Venezuela;Ecuador;Bolivia;Uruguay;Paraguay;Guyana;Suriname;French Guiana"},

/* ---------- matching ---------- */
function clean(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/&/g," and ").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()
    .replace(/^(the|a|an) /,"");
}
function keys(s){
  const k=clean(s).replace(/ /g,""); if(!k) return [];
  const out=new Set([k]);
  if(k.endsWith("ies")&&k.length>4) out.add(k.slice(0,-3)+"y");
  if(k.endsWith("es")&&k.length>4) out.add(k.slice(0,-2));
  if(k.endsWith("s")&&k.length>3) out.add(k.slice(0,-1));
  return [...out];
}
const PROMPTS = RAW.map(p=>{
  const answers=p.a.split(";").map(x=>x.split("|").map(y=>y.trim()));
  const map=new Map();
  answers.forEach((al,i)=>al.forEach(n=>keys(n).forEach(k=>{ if(!map.has(k)) map.set(k,i); })));
  return {q:p.q,answers,names:answers.map(a=>a[0]),map};
});
function lookupExact(P,input){
  for(const k of keys(input)){ if(P.map.has(k)) return P.map.get(k); }
  return -1;
}
/* typo distance: insertions, deletions, substitutions and swapped neighbours each count as 1 */
function dist(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}
  for(let j=0;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++){let rowMin=Infinity;
    for(let j=1;j<=b.length;j++){
      const c=a[i-1]===b[j-1]?0:1;
      let v=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,d[i-2][j-2]+1);
      d[i][j]=v; if(v<rowMin) rowMin=v;}
    if(rowMin>max) return max+1;}
  return d[a.length][b.length];
}
function lookup(P,input){
  const exact=lookupExact(P,input); if(exact>=0) return exact;
  let best=-1,bestD=Infinity,bestFirst=false;
  for(const k of keys(input)){
    const max=k.length<=3?0:k.length<=6?1:2; if(!max) continue;
    for(const [key,idx] of P.map){
      const dd=dist(k,key,max); if(dd>max) continue;
      const first=key[0]===k[0];
      if(dd<bestD||(dd===bestD&&first&&!bestFirst)){best=idx;bestD=dd;bestFirst=first;}
    }
  }
  return best;
}

/* ---------- scoring: elevation +1 = most common (sky), -1 = rarest (sea), 0 = dead center ---------- */
function judge(P,idx){
  if(idx<0) return {tier:"Off the map",pts:0,e:null,code:"x"};
  const n=P.names.length, p=idx/(n-1), e=(0.5-p)*2, d=Math.abs(e);
  const up=e>0;
  const center=idx===Math.round((n-1)/2);
  /* flat points per level; only the exact middle answer scores 100 */
  let tier,code,pts;
  if(center){tier="Dead Center";code="c";pts=100}
  else if(d<=0.15){tier=up?"Upper Ground":"Lower Ground";code="g";pts=85}
  else if(d<=0.45){tier=up?"Uplands":"Lowlands";code="y";pts=60}
  else if(d<=0.8){tier=up?"Cloudline":"Shoreline";code=up?"s":"l";pts=30}
  else {tier=up?"Noillirk's Sky":"Krillion's Sea";code=up?"s":"l";pts=10}
  return {tier,pts,e,code,center};
}

/* ---------- rng ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(seed,count){
  const r=rng(seed), idx=PROMPTS.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  return idx.slice(0,count);
}
/* daily rotation: every prompt is used once before any comes back.
   Day 0 is 28 Oct 2026; each cycle gets its own shuffle. */
function dayNumber(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,9,28))/864e5)}
function dailyOrder(){
  const day=dayNumber(), per=Math.floor(PROMPTS.length/ROUNDS);
  const cycle=Math.floor(day/per), slot=((day%per)+per)%per;
  return pick(hash("midillion-cycle-"+cycle),PROMPTS.length).slice(slot*ROUNDS,slot*ROUNDS+ROUNDS);
}

    <section class="card panel">
      <h2>Name the answer right in the middle.</h2>
      <p>Every prompt has a map of answers, ranked from the one everybody says to the one almost nobody says. The obvious answer floats away into the sky. The obscure one sinks into the sea. Pick the one in between to keep your krill on the ground.</p>
      <div class="rules">
        <div class="rule sky"><b>Too common</b><small>Like "Apple" for a fruit. Few points.</small></div>
        <div class="rule mid"><b>Right in the middle</b><small>Only the exact middle scores 100.</small></div>
        <div class="rule sea"><b>Too rare</b><small>Like "Feijoa". Few points.</small></div>
      </div>
      <p>${ROUNDS} prompts, ${SECONDS} seconds each, up to ${ROUNDS*100} points.</p>
      <div class="row">
        <button class="btn" id="daily">Play today's ${ROUNDS}</button>
        <button class="btn alt" id="practice">Practice round</button>
        ${t?`<span class="today">Today: <b>${t.total}/${ROUNDS*100}</b></span>`:""}
      </div>
    </section>

    <section class="card panel">
      <h2>Who lives where</h2>
      <p>Each answer lands somewhere between the sky and the sea, and whoever lives there shows up for you.</p>
      <div class="legend">${LAND.map(c=>`<div class="lrow ${c.tier==="Dead Center"?"best":""}"><span class="ic">${creature(c.tier,38)}</span><span><b style="color:${c.color}">${esc(c.tier)}</b><small>${esc(c.who)} · ${esc(c.elev)}. ${esc(c.line)}</small></span><code>${c.pts}</code></div>`).join("")}</div>
    </section>
  </div>`;
  document.getElementById("daily").onclick=()=>start("daily");
  document.getElementById("practice").onclick=()=>start("practice");
}

function start(mode){
  const order= mode==="daily" ? dailyOrder() : pick((Math.random()*1e9)|0,ROUNDS);
  S={mode,order,i:0,results:[]};
  round();
}

function meterHTML(P,res){
  const n=P.names.length;
  const ticks=P.names.map((_,i)=>`<span class="tick" style="top:${(i/(n-1))*100}%"></span>`).join("");
  return `<div class="meter" aria-hidden="true">
    ${ticks}
    <div class="zone"></div>
    <span class="tag" style="top:8px">SKY</span>
    <span class="tag" style="top:calc(50% - 8px)">0 m</span>
    <span class="tag" style="bottom:8px">SEA</span>
    <div class="me ${res?"":"idle"}" id="me">${res?creature(res.tier,40):krill()}</div>
  </div>`;
}

function dotsHTML(){
  return `<div class="dots">${Array.from({length:ROUNDS},(_,i)=>{
    const r=S.results[i]; return `<span class="dot ${r?r.code:(i===S.i?"now":"")}"></span>`;}).join("")}</div>`;
}
const total=()=>S.results.reduce((a,r)=>a+r.pts,0);

function round(){
  const P=PROMPTS[S.order[S.i]];
  app.innerHTML=`
  <div class="play">
    ${meterHTML(P,null)}
    <section class="card panel">
      <div class="top">${dotsHTML()}<span>${S.mode==="daily"?"Daily":"Practice"} · <span class="score">${total()} pts</span></span></div>
      <h2 class="prompt">${esc(P.q)}</h2>
      <div class="timer"><i id="bar"></i></div>
      <div class="form">
        <input type="text" id="guess" placeholder="Type your answer" aria-label="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <button class="btn" type="button" id="go">Answer</button>
      </div>
      <div class="miss" id="miss" role="status" hidden></div>
      <div class="hint">This map has <b>${P.names.length}</b> answers. Aim for the one ranked around <b>#${Math.round((P.names.length-1)/2)+1}</b>.</div>
    </section>
  </div>`;
  const inp=document.getElementById("guess"); inp.focus({preventScroll:true});
  let sent=false;
  const send=()=>{
    if(sent) return;
    if(!inp.value.trim()){ inp.placeholder="Type an answer first"; inp.focus(); return; }
    if(lookup(P,inp.value)<0){
      const m=document.getElementById("miss");
      m.textContent=`"${inp.value.trim()}" isn't on our map. Try another answer.`;
      m.hidden=false; m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake");
      inp.value=""; inp.focus(); return;
    }
    sent=true; answer(inp.value);
  };
  document.getElementById("go").addEventListener("click",send);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } });
  const t0=performance.now(), bar=document.getElementById("bar");
  clearInterval(tick);
  tick=setInterval(()=>{
    const left=Math.max(0,1-(performance.now()-t0)/(SECONDS*1000));
    bar.style.width=(left*100)+"%"; bar.classList.toggle("low",left<0.25);
    if(left<=0) answer(null,false,true);
  },100);
}

function answer(text,skipped,timeout){
  clearInterval(tick);
  const P=PROMPTS[S.order[S.i]];
  const idx= text ? lookup(P,text) : -1;
  let r=judge(P,idx);
  if(timeout) r={...r,tier:"Out of time"};
  if(skipped) r={...r,tier:"Skipped"};
  r.input = idx>=0 ? P.names[idx] : (text||"");
  r.fixed = (idx>=0 && lookupExact(P,text)<0) ? text.trim() : "";
  r.rank = idx>=0 ? idx+1 : null;
  r.q=P.q;
  S.results[S.i]=r;
  reveal(P,r);
}

function reveal(P,r){
  const n=P.names.length, mid=Math.round((n-1)/2);
  const last=S.i===ROUNDS-1;
  const elev = r.e===null ? "" : (r.center ? "0 m · dead center" : (r.e>0?"+":"−")+Math.round(Math.abs(r.e)*1000)+" m "+(r.e>0?"above ground":"below sea level"));
  const blurb = r.center ? "Dead center. The golden snail found the one answer worth 100." : (BLURB[r.tier] || "No answer this time.");
  app.innerHTML=`
  <div class="play">
    ${meterHTML(P,r)}
    <section class="card panel">
      <div class="top">${dotsHTML()}<span>${S.mode==="daily"?"Daily":"Practice"} · <span class="score">${total()} pts</span></span></div>
      <h2 class="prompt">${esc(P.q)}</h2>
      <div class="reveal">
        <div class="verdict"><h3 style="color:${r.code==="c"?"var(--gold)":r.code==="g"?"var(--mint)":r.code==="y"?"var(--gold)":r.code==="s"?"var(--sky)":r.code==="l"?"var(--lavender)":"var(--muted)"}">${r.center?"sNailed it!":esc(r.tier)}</h3><span class="pts">+${r.pts}</span></div>
        <div class="yours">${creature(r.tier,44)}<div><b>${r.rank?esc(r.input):(r.input?"“"+esc(r.input)+"”":"No answer")}</b>${r.fixed?` <span class="elev">(you typed “${esc(r.fixed)}”)</span>`:""}<br>${r.rank?`Ranked #${r.rank} of ${n}. `:""}${esc(blurb)}${elev?` <span class="elev">${elev}</span>`:""}</div></div>
        <div class="note">The answers for every prompt are revealed at the end.</div>
        <div class="row"><button class="btn" id="next">${last?"See my results":"Next prompt"}</button></div>
      </div>
    </section>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const me=document.getElementById("me");
    if(r.e===null){ me.style.top="50%"; me.style.opacity=".35"; }
    else me.style.top=((1-r.e)/2*100)+"%";
  }));
  const nx=document.getElementById("next"); nx.focus({preventScroll:true});
  nx.onclick=()=>{ if(last) finish(); else { S.i++; round(); } };
}

function titleFor(){
  const tot=total(), avg=tot/ROUNDS;
  const es=S.results.filter(r=>r.e!==null).map(r=>r.e);
  const lean=es.length?es.reduce((a,b)=>a+b,0)/es.length:0;
  if(avg>=85) return ["Center of the Earth","You found the middle almost every time."];
  if(avg>=65) return ["Steady Footing","Your krill barely left the ground."];
  if(lean>0.2) return ["Head in the Clouds","Your answers leaned toward the obvious. Try going a little deeper."];
  if(lean<-0.2) return ["Lost at Sea","Your answers leaned toward the obscure. Try something more familiar."];
  return ["Hill Walker","Up and down, but you kept coming back to the middle."];
}

function finish(){
  const tot=total(), [title,line]=titleFor();
  if(S.mode==="daily"){ const prev=store("midillion-"+todayStr()); if(!prev||tot>prev.total) store("midillion-"+todayStr(),{total:tot}); }
  const share=`Midillion ${S.mode==="daily"?todayStr():"practice"} · ${tot}/${ROUNDS*100}\n${S.results.map(r=>SHARE[r.code]).join("")}`;
  app.innerHTML=`
  <section class="card panel final">
    ${krill("#E2457A",80)}
    <div class="big">${tot}<span style="font-size:1.2rem;color:var(--muted)"> / ${ROUNDS*100}</span></div>
    <div class="title">${esc(title)}</div>
    <p>${esc(line)}</p>
    <div class="land" aria-label="Where each answer landed">${S.results.map((r,i)=>{
      const pos=r.e===null?50:(1-r.e)/2*100, top=Math.min(50,pos), h=Math.abs(pos-50);
      return `<div class="col"><span class="line" style="top:${top}%;height:${h}%"></span><span class="cr" style="top:${pos}%">${creature(r.tier,30)}</span><span class="num">${i+1}</span></div>`;}).join("")}</div>
    <h2 style="align-self:flex-start">The answers</h2>
    <div class="recap">${S.results.map(r=>{
      const P=PROMPTS.find(x=>x.q===r.q), n=P.names.length, mid=Math.round((n-1)/2);
      const near=P.names.slice(Math.max(0,mid-3),mid).concat(P.names.slice(mid+1,mid+4)).map(esc).join(", ");
      return `<article class="ritem">
        <div class="rrow"><span class="ric">${creature(r.tier,28)}</span><span>${esc(r.q)}<br><em>You: ${r.rank?esc(r.input)+" · #"+r.rank+" of "+n:esc(r.tier)}</em></span><em>${esc(r.tier)}</em><code>+${r.pts}</code></div>
        <div class="rans"><span class="chip sky"><small>Most common</small>${esc(P.names[0])}</span><span class="chip mid"><small>Dead center</small>${esc(P.names[mid])}</span><span class="chip sea"><small>Rarest</small>${esc(P.names[n-1])}</span></div>
        <div class="note">Also on solid ground: ${near}.</div>
      </article>`;}).join("")}</div>
    <textarea id="share" rows="2" readonly aria-label="Share text">${esc(share)}</textarea>
    <div class="row" style="justify-content:center">
      <button class="btn" id="copy">Copy result</button>
      <button class="btn alt" id="again">Practice round</button>
      <button class="btn ghost" id="home">Home</button>
    </div>
  </section>`;
  const ta=document.getElementById("share"), cp=document.getElementById("copy");
  cp.onclick=()=>{
    const done=()=>{cp.textContent="Copied"; setTimeout(()=>cp.textContent="Copy result",1600)};
    const fallback=()=>{ta.focus();ta.select();cp.textContent="Selected, press copy"};
    try{ navigator.clipboard.writeText(share).then(done,fallback); }catch(e){ fallback(); }
  };
  document.getElementById("again").onclick=()=>start("practice");
  document.getElementById("home").onclick=home;
}

home();
</script>

</body>
</html>
